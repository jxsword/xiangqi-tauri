# 三平台安装包自动构建（CI + CD）
# 触发方式：
#   1. 推送 main 分支 / 提交 pull request —— CI 构建验证
#   2. 推送 v 开头的 tag（如 v0.1.0）——构建并发布到 GitHub Release（正式版）
#   3. 手动触发（Actions 页面点击 Run workflow）
#   4. main 分支每次构建成功 —— 自动更新「开发版」Release（tag: dev，pre-release）
# 产出：
#   - windows-latest : NSIS 安装器（-setup.exe）+ xiangqi-windows-x86_64.exe 裸二进制
#   - macos-latest   : .app + .dmg + xiangqi-macos-aarch64 裸二进制（默认 runner 架构；
#                      如需 Intel+Apple Silicon 通用包，在下方 bundle_args 追加
#                      --target universal-apple-darwin 并同步调整 binary_name）
#   - ubuntu-22.04   : .deb + .AppImage + xiangqi-linux-x86_64 裸二进制
# 缓存策略（体积大 / 安装耗时的部分）：
#   - npm 依赖        : setup-node cache:npm（已有）
#   - Rust 编译产物   : swatinem/rust-cache（已有，workspace 根在仓库根 target/）
#   - Rust 工具链     : ~/.rustup（rustc/rust-std 下载安装约 1-3 分钟）
#   - Tauri 打包工具  : NSIS / linuxdeploy / WebView2 等下载缓存
#                      （Linux/macOS: ~/.cache/tauri，Windows: %LOCALAPPDATA%\tauri）
#   - apt 系统包      : /var/cache/apt/archives（Linux 专属）
# 注意：本仓库为 Cargo workspace（根目录 Cargo.toml），Tauri 产物输出在仓库根的
#       target/release/bundle/ 下，而非 src-tauri/target/。
name: 构建三平台安装包

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_args: '--bundles nsis'
            tauri_cache: 'C:\Users\runneradmin\AppData\Local\tauri'
            binary_name: 'xiangqi-windows-x86_64.exe'
          - platform: macos-latest
            bundle_args: ''
            tauri_cache: '~/.cache/tauri'
            binary_name: 'xiangqi-macos-aarch64'
          - platform: ubuntu-22.04
            bundle_args: '--bundles deb,appimage'
            tauri_cache: '~/.cache/tauri'
            binary_name: 'xiangqi-linux-x86_64'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 缓存 Rust 工具链（rustc / rust-std 安装耗时大头）
        uses: actions/cache@v4
        with:
          path: ~/.rustup
          key: ${{ runner.os }}-rustup-stable-v1

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物（cargo registry + target）
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'

      - name: 缓存 apt 下载的安装包（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-archives-v1

      - name: 缓存 Tauri 打包工具下载（NSIS / linuxdeploy / WebView2）
        uses: actions/cache@v4
        with:
          path: ${{ matrix.tauri_cache }}
          key: ${{ runner.os }}-tauri-tools-v1

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - name: 准备 release 二进制（按平台重命名，避免同名覆盖）
        shell: bash
        run: |
          if [ -f target/release/xiangqi.exe ]; then
            cp target/release/xiangqi.exe target/release/${{ matrix.binary_name }}
          else
            cp target/release/xiangqi target/release/${{ matrix.binary_name }}
          fi
          ls -lh target/release/${{ matrix.binary_name }}

      - name: 上传构建产物（Windows）
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: 上传构建产物（macOS）
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-macos
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
            target/release/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: 上传构建产物（Linux）
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/${{ matrix.binary_name }}
          if-no-files-found: error

      - name: 发布正式版到 GitHub Release（仅 v* tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/xiangqi-windows-x86_64.exe
            target/release/xiangqi-macos-aarch64
            target/release/xiangqi-linux-x86_64
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          fail_on_unmatched_files: false
          generate_release_notes: true

  # main 分支每次构建成功后，把三平台产物发布到滚动更新的「开发版」Release（tag: dev）
  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出源码（用于移动 dev 标签）
        uses: actions/checkout@v4

      - name: 下载三平台构建产物
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 更新 dev 标签并发布开发版 Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 1) 把 dev 标签移动到当前提交
          git tag -f dev HEAD
          git push -f origin dev
          # 2) 删除旧的 dev Release，避免同名资产冲突
          old_id=$(gh api "repos/$repo/releases/tags/dev" --jq '.id' 2>/dev/null || true)
          if [ -n "$old_id" ]; then
            gh api -X DELETE "repos/$repo/releases/$old_id" >/dev/null
          fi
          # 3) 创建新的开发版 Release 并上传全部产物（仅顶层文件，不含 .app 目录）
          assets=$(find release-assets -maxdepth 1 -type f)
          gh release create dev \
            --repo "$repo" \
            --title "开发版构建（dev）" \
            --prerelease \
            --notes "由 main 分支每次成功构建自动更新 · commit ${{ github.sha }}" \
            $assets
          gh release view -R "$repo" dev --json assets --jq '.assets[] | .name'
