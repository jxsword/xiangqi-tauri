# 三平台安装包自动构建（CI）
# 触发方式：
#   1. 推送 main 分支 / 提交 pull request —— CI 构建验证
#   2. 推送 v 开头的 tag（如 v0.1.0）——构建并发布到 GitHub Release
#   3. 手动触发（Actions 页面点击 Run workflow）
# 产出：
#   - windows-latest : NSIS 安装器（-setup.exe）
#   - macos-latest   : .app + .dmg（默认 runner 架构；如需 Intel+Apple Silicon 通用包，
#                      在下方 bundle_args 追加 --target universal-apple-darwin）
#   - ubuntu-22.04   : .deb + .AppImage
name: 构建三平台安装包

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundle_args: '--bundles nsis'
          - platform: macos-latest
            bundle_args: ''
          - platform: ubuntu-22.04
            bundle_args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            pkg-config

      - name: 安装前端依赖
        run: npm ci

      - name: 构建安装包
        run: npm run tauri build -- ${{ matrix.bundle_args }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: xiangqi-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: 发布到 GitHub Release（仅 tag 推送时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/macos/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          generate_release_notes: true
